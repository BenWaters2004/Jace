name: Jace Phase 0A Quality Baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-quality:
    name: Python syntax, runner contracts and tracked-file audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run quick quality checks (no production access)
        run: python tools/jace_quality.py --profile quick
      - name: Upload machine-readable diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jace-quick-quality
          path: |
            data/quality/last-run.json
            data/quality/last-run.md
          if-no-files-found: warn

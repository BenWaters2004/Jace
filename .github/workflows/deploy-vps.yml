name: Deploy Jace VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jace-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check backend Python syntax
        run: python -m compileall -q backend/jace
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v7
      - name: Build clean server bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/jace-stage"
          bundle="${RUNNER_TEMP}/jace-server-${GITHUB_SHA}.tar.gz"
          rm -rf "${stage}"
          mkdir -p "${stage}/jace"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='target' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.mypy_cache' \
            --exclude='.ruff_cache' \
            --exclude='.jace-patch-backups' \
            --exclude='data' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            "${GITHUB_WORKSPACE}/" "${stage}/jace/"
          printf '%s\n' "${GITHUB_SHA}" > "${stage}/jace/.jace-deploy-commit"
          tar -C "${stage}" -czf "${bundle}" jace
          bundle_sha="$(sha256sum "${bundle}" | awk '{print $1}')"
          echo "Bundle SHA256: ${bundle_sha}"
          echo "path=${bundle}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${bundle_sha}" >> "${GITHUB_OUTPUT}"
      - name: Deploy over HTTPS
        shell: bash
        env:
          DEPLOY_URL: ${{ secrets.JACE_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.JACE_DEPLOY_TOKEN }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_URL}"
          test -n "${DEPLOY_TOKEN}"
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --connect-timeout 15 \
            --max-time 900 \
            -X POST \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "X-Jace-Commit: ${GITHUB_SHA}" \
            -H "X-Jace-SHA256: ${BUNDLE_SHA256}" \
            -H 'Content-Type: application/gzip' \
            --data-binary "@${BUNDLE}" \
            "${DEPLOY_URL}"

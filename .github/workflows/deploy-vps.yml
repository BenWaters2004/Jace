name: Deploy Jace VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jace-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check backend syntax
        run: python -m compileall -q backend/jace

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop
        working-directory: apps/desktop
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Build clean server bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/jace-stage"
          bundle="${RUNNER_TEMP}/jace-server-${GITHUB_SHA}.tar.gz"

          rm -rf "${stage}"
          mkdir -p "${stage}/jace"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='target' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.mypy_cache' \
            --exclude='.ruff_cache' \
            --exclude='.jace-patch-backups' \
            --exclude='data' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            "${GITHUB_WORKSPACE}/" \
            "${stage}/jace/"

          printf '%s\n' "${GITHUB_SHA}" > "${stage}/jace/.jace-deploy-commit"
          tar -C "${stage}" -czf "${bundle}" jace
          sha256sum "${bundle}"

          echo "path=${bundle}" >> "${GITHUB_OUTPUT}"
          echo "name=jace-server-${GITHUB_SHA}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Configure deployment SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"

          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/jace_deploy"
          chmod 0600 "${HOME}/.ssh/jace_deploy"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/known_hosts"

      - name: Upload bundle
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          scp \
            -P "${port}" \
            -i "${HOME}/.ssh/jace_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${BUNDLE}" \
            "jace-deploy@${VPS_HOST}:/home/jace-deploy/incoming/${BUNDLE_NAME}"

      - name: Deploy bundle
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          ssh \
            -p "${port}" \
            -i "${HOME}/.ssh/jace_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "jace-deploy@${VPS_HOST}" \
            "sudo /usr/local/sbin/jace-deploy-bundle '/home/jace-deploy/incoming/${BUNDLE_NAME}'"

      - name: Remove local deployment key
        if: always()
        run: rm -f "${HOME}/.ssh/jace_deploy"
